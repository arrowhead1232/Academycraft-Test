name: Bootstrap Forge 1.20.1 port

on:
  push:
    branches:
      - agent/forge-1.20.1-port
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academycraft-port-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct port source
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/academycraft-source"
          patch_file="$RUNNER_TEMP/academycraft-port.patch"
          git clone --filter=blob:none https://github.com/AcademyCraft-Dev-Team/AcademyCraft-Reborn.git "$source_dir"
          git -C "$source_dir" checkout --detach 677198bb7df5d313730e26e6f39e12dd116b9a78
          base64 --decode bootstrap/port.patch.gz.b64 | gzip --decompress > "$patch_file"
          git -C "$source_dir" apply --binary --whitespace=nowarn "$patch_file"
          chmod +x "$source_dir/gradlew"

      - name: Build Forge 1.20.1
        working-directory: ${{ runner.temp }}/academycraft-source
        run: ./gradlew --no-daemon :forge:build --stacktrace

      - name: Upload Forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: academycraft-forge-1.20.1
          path: ${{ runner.temp }}/academycraft-source/forge/build/output/*.jar
          if-no-files-found: error

      - name: Publish full source branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan source-export
          git rm -rf . || true
          rsync -a --exclude=.git "$RUNNER_TEMP/academycraft-source/" "$GITHUB_WORKSPACE/"
          git add -A
          git commit -m "feat: publish AcademyCraft Forge 1.20.1 port source"
          git push --force origin HEAD:refs/heads/agent/forge-1.20.1-source
