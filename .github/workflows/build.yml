name: Build

on:
  pull_request:
    branches:
      - 1.20.1
  push:
    branches:
      - 1.20.1
      - 'agent/**'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forge-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew --no-daemon :forge:build --stacktrace

      - name: Upload Forge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: academycraft-forge-1.20.1
          path: forge/build/output/*.jar
          if-no-files-found: error
